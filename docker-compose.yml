services:
  app:
    image: pos-laravel-development
    build:
      context: .
      dockerfile: build/Dockerfile
      target: development
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8020}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-dpos}
      DB_USERNAME: ${DB_USERNAME:-dpos}
      DB_PASSWORD: ${DB_PASSWORD:-pospassword}
      REDIS_HOST: redis
      APP_PORT: ${NGINX_APP_PORT:-80}
      NGINX_APP_PORT: ${NGINX_APP_PORT:-80}
      RUN_DB_INIT: ${RUN_DB_INIT:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      # Destructive resets must be run explicitly with `artisan migrate:fresh`.
      RESET_DB_ON_BOOT: "false"
      SEED_DB_ON_BOOT: ${SEED_DB_ON_BOOT:-false}
      REVERB_HOST: reverb
      REVERB_PORT: 81
    ports:
      - "${APP_PORT:-8020}:8000"
    volumes:
      - ./application:/var/www/html
      - vendor_data:/var/www/html/vendor
      - composer_cache:/tmp/composer-cache
      - ./application/example.CaddyFile:/etc/frankenphp/Caddyfile:ro
      - ./build/php/opcache.dev.ini:/usr/local/etc/php/conf.d/zz-opcache.dev.ini:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 120s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pos-network

  reverb:
    image: pos-laravel-development
    init: true
    restart: unless-stopped
    entrypoint: ["frankenphp", "php-cli"]
    command:
      - artisan
      - reverb:start
      - --host=0.0.0.0
      - --port=81
      - --no-interaction
    env_file:
      - .env
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-dpos}
      DB_USERNAME: ${DB_USERNAME:-dpos}
      DB_PASSWORD: ${DB_PASSWORD:-pospassword}
      REDIS_HOST: redis
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 81
    ports:
      - "${REVERB_PORT:-81}:81"
    volumes:
      - ./application:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy
    networks:
      - pos-network

  vite:
    build:
      context: .
      dockerfile: build/Dockerfile
      target: frontend-development
    init: true
    restart: unless-stopped
    environment:
      VITE_HOST_PORT: ${VITE_PORT:-5173}
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: ${REVERB_PORT:-81}
      VITE_REVERB_SCHEME: http
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./application:/var/www/html
      - node_modules_data:/var/www/html/node_modules
      - npm_cache:/home/node/.npm
    networks:
      - pos-network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dpos}
      MYSQL_USER: ${DB_USERNAME:-dpos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pospassword}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-pospassword}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pos-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - pos-network

networks:
  pos-network:
    driver: bridge

volumes:
  composer_cache:
  mysql_data:
  node_modules_data:
  npm_cache:
  redis_data:
  vendor_data:
