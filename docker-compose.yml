services:
  app:
    build:  
      context: .
      dockerfile: build/Dockerfile
    container_name: pos-app
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    volumes:
      - app-storage:/var/www/html/storage
      - app-bootstrap-cache:/var/www/html/bootstrap/cache
    networks:
      - pos-network
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: pos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./build/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-storage:/var/www/html/storage:ro
    networks:
      - pos-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: pos-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dpos}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pospassword}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-pospassword}
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - pos-network

  redis:
    image: redis:alpine
    container_name: pos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    depends_on:
      - mysql
    networks:
      - pos-network

volumes:
  app-storage:
  app-bootstrap-cache:
  db-data:
  redis-data:

networks:
  pos-network:
    driver: bridge
