version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos-app
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY:-}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=pos
      - DB_USERNAME=posuser
      - DB_PASSWORD=pospassword
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=80001
      - REVERB_HOST=reverb # Nginx proxy uses this host
      - REVERB_PORT=8080
      # ... add other required env vars
    volumes:
      - app-storage:/var/www/html/storage
      - app-bootstrap-cache:/var/www/html/bootstrap/cache
    networks:
      - pos-network
    depends_on:
      - mysql
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos-worker
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=pos
      - DB_USERNAME=posuser
      - DB_PASSWORD=pospassword
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
    networks:
      - pos-network
    depends_on:
      - app
      - redis

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=${REVERB_SERVER_PORT} --no-interaction
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=pos
      - DB_USERNAME=posuser
      - DB_PASSWORD=pospassword
      - REDIS_HOST=redis
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8001
    networks:
      - pos-network
    depends_on:
      - app
      - redis

  nginx:
    image: nginx:alpine
    container_name: pos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-storage:/var/www/html/storage:ro
    networks:
      - pos-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: pos-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: pos
      MYSQL_USER: posuser
      MYSQL_PASSWORD: pospassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - pos-network

  redis:
    image: redis:alpine
    container_name: pos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - pos-network

volumes:
  app-storage:
  app-bootstrap-cache:
  db-data:
  redis-data:

networks:
  pos-network:
    driver: bridge
