services:
  app:
    build:
      context: .
      dockerfile: build/Dockerfile
      target: app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-dpos}
      DB_USERNAME: ${DB_USERNAME:-dpos}
      DB_PASSWORD: ${DB_PASSWORD:-pospassword}
      REDIS_HOST: redis
      APP_PORT: ${NGINX_APP_PORT:-80}
      NGINX_APP_PORT: ${NGINX_APP_PORT:-80}
      RUN_DB_INIT: ${RUN_DB_INIT:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      RESET_DB_ON_BOOT: ${RESET_DB_ON_BOOT:-false}
      SEED_DB_ON_BOOT: ${SEED_DB_ON_BOOT:-false}
    volumes:
      - /var/www/html/vendor
      - /var/www/html/public/build
      - ./application:/var/www/html
      - ./build/php/opcache.dev.ini:/usr/local/etc/php/conf.d/zz-opcache.dev.ini:ro
      - vendor_data:/var/www/html/vendor
      - build_data:/var/www/html/public/build
      - node_modules_data:/var/www/html/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pos-network
    develop:
      watch:
        - path: ./application
          action: sync
          target: /var/www/html
          ignore:
            - vendor/
            - node_modules/
            - public/build/
            - storage/
        - path: ./application/composer.json
          action: rebuild
        - path: ./application/composer.lock
          action: rebuild
        - path: ./application/package.json
          action: rebuild
        - path: ./application/package-lock.json
          action: rebuild
        - path: build/Dockerfile
          action: rebuild
        - path: build/entrypoint.sh
          action: rebuild

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./build/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - pos-network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dpos}
      MYSQL_USER: ${DB_USERNAME:-dpos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pospassword}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-pospassword}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pos-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - pos-network

networks:
  pos-network:
    driver: bridge

volumes:
  vendor_data:
  node_modules_data:
  build_data:
  mysql_data:
  redis_data:
  nginx_logs:
