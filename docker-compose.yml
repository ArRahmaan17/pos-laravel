services:
  app:
    build:  
      context: .
      dockerfile: build/Dockerfile
    container_name: pos-app
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - APP_ENV=${APP_ENV:-production}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-dpos}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-pospassword}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-pospassword}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - APP_PORT=${APP_PORT:-80}
      - REVERB_PORT=${REVERB_PORT:-8001}
    volumes:
      - ./application:/var/www/html
      - ./application/vendor:/var/www/html/vendor
      - ./application/storage:/var/www/html/storage
      - ./application/bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pos-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    

  nginx:
    image: nginx:alpine
    container_name: pos-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./build/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./data/logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - pos-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M

  mysql:
    image: mysql:8.0
    container_name: pos-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dpos}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pospassword}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-pospassword}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./data/database:/var/lib/mysql
    networks:
      - pos-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:alpine
    container_name: pos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - ./data/redis:/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pos-network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G

networks:
  pos-network:
    driver: bridge
