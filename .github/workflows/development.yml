name: Development DPOS Deploy

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  development-check:
    runs-on: self-hosted
    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐋 Docker Compose Up
        # --build memastikan image terbaru selalu dibuat
        run: docker compose up -d --build

      - name: 🧰 Install Dependencies
        # Jalankan composer di dalam container aplikasi
        run: docker compose exec -T app composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: ✨ Run Laravel Pint
        # Jalankan pint di dalam container
        run: docker compose exec -T app ./vendor/bin/pint --test

      - name: 🛑 Cleanup
        # Matikan container setelah selesai test (biar hemat RAM server)
        if: always()
        run: docker compose down