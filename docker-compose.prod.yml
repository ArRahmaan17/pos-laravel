services:
  app:
    build:
      context: .
      dockerfile: build/Dockerfile.multi-pm
      target: app
    restart: always
    init: true
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-dpos}
      DB_USERNAME: ${DB_USERNAME:-dpos}
      DB_PASSWORD: ${DB_PASSWORD:-pospassword}
      REDIS_HOST: redis
      APP_PORT: ${APP_PORT:-80}
      NGINX_APP_PORT: ${NGINX_APP_PORT:-80}
      RUN_DB_INIT: ${RUN_DB_INIT:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      RESET_DB_ON_BOOT: ${RESET_DB_ON_BOOT:-false}
      SEED_DB_ON_BOOT: ${SEED_DB_ON_BOOT:-false}
      REVERB_HOST: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: ${REVERB_PORT:-8001}
      REVERB_PORT: ${REVERB_PORT:-8001}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pos-network

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./build/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - pos-network

  mysql:
    image: mysql:8.0
    restart: always
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dpos}
      MYSQL_USER: ${DB_USERNAME:-dpos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pospassword}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-pospassword}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pos-network

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - pos-network

networks:
  pos-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  nginx_logs:
