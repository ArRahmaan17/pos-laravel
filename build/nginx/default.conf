upstream frankenphp {
    server app:80;
    keepalive 64;
}
upstream reverb {
    server app:8001;
    keepalive 64;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect HTTP → HTTPS (uncomment when SSL is configured)
    # return 301 https://$host$request_uri;

    # Root is completely removed because Nginx has no access to app container storage

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Logging ────────────────────────────────────────────────────────────────
    # Disabled file assets access log (now handled by FrankenPHP if needed)
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # Disable Nginx's obsession with its internal port (80)
    port_in_redirect off;
    absolute_redirect off;

    # ── Client settings ───────────────────────────────────────────────────────
    client_max_body_size 50M;
    client_body_timeout  15s;

    # ── Laravel Reverb WebSocket ───────────────────────────────────────────────
    # Proxy WebSocket upgrade traffic to Reverb service
    location /app {
        proxy_pass         http://reverb;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── All other requests → FrankenPHP ──────────────────────────────────────
    location / {
        limit_req zone=api burst=60 nodelay;

        proxy_pass         http://frankenphp;
        proxy_http_version 1.1;

        # Extract port from Host header or fallback to server_port
        set $p $server_port;
        if ($http_host ~ ":(\d+)$") {
            set $p $1;
        }

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $p;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering    on;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
        proxy_busy_buffers_size 256k;
    }


    # Nginx acts strictly as a reverse proxy.
    # PHP and hidden file protections are already handled by the frontend webserver (FrankenPHP) and our proxy mapping.
}
